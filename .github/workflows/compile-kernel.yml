name: Build LubanCat Kernel

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 kmod cpio

    - name: Build Kernel
      run: |
        # 1. 配置环境变量（指定架构为 ARM64，交叉编译器为 aarch64-linux-gnu-）
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 2. 生成配置文件（根据鲁班猫官方推荐的 defconfig，这里以 rk3588 为例，具体视板卡而定）
        # 你可以去 arch/arm64/configs/ 目录下查看具体的配置文件名
        make lubancat_linux_rk356x_defconfig 
        
        # 3. 编译并打包为 deb 或者是直接编译出 Image/dtb
        # 这里以该仓库自带的打包脚本或标准 make 为准，如果是标准内核：
        make -j$(nproc) bindeb-pkg

    - name: Upload Kernel Packages
      uses: actions/upload-artifact@v4
      with:
        name: lubancat-kernel-deb
        path: ../*.deb
